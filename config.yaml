# Settings for the RAG system. The Ollama address comes from OLLAMA_HOST (see .env.example).

models:
  llm: qwen3.5:4b
  embedding: qwen3-embedding:0.6b
  think: false          

chunking:
  # size_words: 250
  # overlap_words: 50
  size_words: 400       #version 2 (sweep: 14/22 hits)
  # overlap_words: 80   # exploratory alternative, compared in step 5.5
  overlap_words: 0      #version 3 (overlap sweep, pre-set rule)

embedding:
  # add_title: true       
  add_title: false   #version 2    
  batch_size: 32

retrieval:
  top_k: 5
  mode: dense           # dense, hybrid (step 6.2) or mmr (step 6.3)
  # mode: hybrid           
  # mode : mmr
  rrf_k: 60
  # mmr_lambda: 0.7       # mmr mode (step 6.3)
  pool: 20
  query_instruction: >-
    Given a question about image captioning and vision-language model evaluation,
    retrieve research-paper passages that directly answer the question or provide
    evidence for comparing methods, metrics, results, or limitations.

generation:
  temperature: 0
  num_ctx: 8192        
  no_evidence_reply: NOT ENOUGH EVIDENCE

paths:
  manifest: papers/manifest.csv
  papers_dir: data/papers   
  index_dir: data/index
