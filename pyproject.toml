[project]
name = "research-rag"
version = "0.1.0"
description = "Local RAG assistant over openly licensed research papers on image captioning and VLM evaluation"
readme = "README.md"
authors = [
    { name = "Gilbert Owen", email = "psychoganko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
research-rag = "research_rag:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
